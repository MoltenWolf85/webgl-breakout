name: dist Folder Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    # CRITICAL FIX: Grants the workflow write access to push commits and create releases
    permissions:
      contents: write
      
    steps:
      # UPGRADED: v4 removes the Node.js deprecation warning
      - name: Checkout repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable sparse checkout
        run: |
          git sparse-checkout init --cone
          git sparse-checkout set dist

      - name: Commit dist-only tree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Keep only dist folder" || echo "No changes to commit"

      - name: Push to dist-only branch
        run: |
          git push origin HEAD:dist-only

      - name: Zip dist folder
        run: zip -r dist.zip dist

      # UPGRADED: Completed the softprops/action-gh-release setup
      - name: Create release with zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: dist.zip
          draft: false
          prerelease: false
